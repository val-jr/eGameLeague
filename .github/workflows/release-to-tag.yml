name: Criar Tag e Release Version

on:
  push:
    branches:
      - "release"

permissions:
  contents: write
  pull-requests: write

jobs:
  tag-e-release:
    name: Criar tag e release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar semantic-release
        run: npm install -g semantic-release @semantic-release/git @semantic-release/changelog @semantic-release/github

      - name: Rodar semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: semantic-release

  crier-pr-main:
    name: Criar PR Release -> Main
    runs-on: ubuntu-latest
    needs: tag-e-release

    steps:
      - name: Extrair nome da branch
        id: extract_branch
        run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

      - name: Criar PR Release -> Main
        uses: actions/github-script@v6
        with:
          script: |
            const branch = process.env.BRANCH_NAME;
            const base = 'main';

            // Obter últimos commits da branch
            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: branch,
              per_page: 10
            });

            const changelog = commits.data.map(commit => `- ${commit.commit.message} (${commit.sha.substring(0, 7)})`).join('\n');

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Main: Merge release into main',
              head: branch,
              base: base,
              body: `🔁 PR de integração da release na main \n\n**Commits recentes:**\n${changelog}`,
              draft: false
            });

            // Adicionar label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.data.number,
              labels: ['auto-pr'],
            });
